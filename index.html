const storageKey="panel-derived-key";
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const encode=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function forget(){try{localStorage.removeItem(storageKey)}catch(e){}}
async function openPanel(raw,remember){
 const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const clear=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
 if(remember){try{localStorage.setItem(storageKey,encode(raw))}catch(e){}}else forget();
 document.open();document.write(new TextDecoder().decode(clear));document.close();
}
document.getElementById("unlock").onsubmit=async e=>{
 e.preventDefault();const button=document.getElementById("submit");button.disabled=true;
 try{
  const input=document.getElementById("password");
  const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(input.value),"PBKDF2",false,["deriveBits"]);input.value="";
  const raw=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(payload.salt),iterations:600000},material,256);
  await openPanel(raw,document.getElementById("remember").checked);
 }catch(e){forget();document.getElementById("error").textContent="Şifre yanlış";button.disabled=false;}
};
(async()=>{let saved;try{saved=localStorage.getItem(storageKey)}catch(e){}
 if(saved){try{await openPanel(bytes(saved),true)}catch(e){forget();}}
})();
</script></body></html>
